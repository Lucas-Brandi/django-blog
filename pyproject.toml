[project]
name = "django-blog"
version = "0.1.0"
description = "Blog em Django com API REST, contas de usuário e perfil."
requires-python = ">=3.12"
# Dependências de PRODUÇÃO. Precisam estar aqui porque o builder Python da
# Vercel usa o uv e, quando existe um pyproject.toml, ele tem prioridade sobre
# o requirements.txt. Mantenha esta lista em sincronia com o requirements.txt
# (que continua sendo usado pelo Docker/venv local). As ferramentas de dev
# (ruff, pytest) ficam fora, em requirements-dev.txt.
dependencies = [
    "Django~=6.1.3",
    "djangorestframework~=3.18.0",
    "djangorestframework-simplejwt~=5.5.0",
    "django-cors-headers~=4.9.0",
    "drf-spectacular[sidecar]~=0.30.0",
    "Pillow~=13.0",
    "psycopg[binary]~=3.3",
    "django-storages~=1.14.4",
    "boto3~=1.35",
]

[tool.uv]
# O projeto é uma aplicação Django (layout flat), não um pacote instalável.
# Sem isto, o uv poderia tentar "construir" o projeto no build da Vercel e
# falhar. Assim ele apenas instala as dependências de [project].
package = false

[tool.ruff]
# Limite de linha padrão da comunidade Python/Django
line-length = 120

# Alvo da versão de sintaxe do Python (venv atual é 3.13)
target-version = "py313"

# Pastas que o Ruff deve ignorar completamente
extend-exclude = [
    "venv",
    ".venv",
    "**/migrations/**",
]

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes (Flake8), I = isort
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
# Trata os apps locais como first-party para ordenar os imports corretamente
known-first-party = ["blog", "users", "config"]

[tool.ruff.format]
# Usa aspas duplas e indentação por espaços (padrão)
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Aponta para o módulo de settings dentro da pasta config
DJANGO_SETTINGS_MODULE = "config.settings"

# Padrões de descoberta de arquivos de teste
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Diretórios onde o pytest procura os testes
testpaths = ["blog", "users"]

# Opções padrão ao rodar o pytest
addopts = "-v --reuse-db"
